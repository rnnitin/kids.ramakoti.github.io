<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grade 1 - Math Puzzle Quest</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="app-header" id="appHeader"></header>

    <section class="section">
      <h2>Today’s Quest</h2>
      <p class="sub">Pick a game. Solve 3 puzzles. Get a shiny badge ⭐</p>

      <div class="progress-row">
        <div id="progressText" class="sub"></div>
        <div class="progress"><div id="progressBarFill"></div></div>
      </div>
    </section>

    <section class="section">
      <h2>Choose a Game</h2>
      <div class="grid" id="topicsGrid"></div>
    </section>

    <section class="section puzzle-area" id="puzzlePanel">
      <h2>Puzzle Space</h2>
      <p class="sub">Choose a topic to start playing!</p>
    </section>

    <div class="footer">Grade 1 mode • Small steps, big brain 🧠</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
