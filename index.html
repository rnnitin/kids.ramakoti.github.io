<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math Puzzle Quest - Choose Player</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --card-hover: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --accent-2: #60a5fa;
      --ring: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% -10%, #1d4ed8 0%, transparent 55%),
                  radial-gradient(1200px 800px at 100% 0%, #16a34a 0%, transparent 60%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .container {
      width: min(900px, 100%);
      text-align: center;
    }
    h1 {
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      margin: 0 0 8px;
      letter-spacing: 0.3px;
    }
    p.subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: clamp(1rem, 1.6vw, 1.1rem);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 12px;
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 40%),
                  var(--card);
      border: 1px solid var(--ring);
      border-radius: 18px;
      padding: 20px 18px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease, border 0.12s ease;
      display: grid;
      gap: 10px;
    }
    .card:hover { 
      transform: translateY(-3px);
      background: var(--card-hover);
      border-color: rgba(255,255,255,0.16);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px; height: 64px;
      border-radius: 999px;
      font-size: 2rem;
      margin: 0 auto;
      background: rgba(255,255,255,0.06);
    }
    .name {
      font-size: 1.35rem;
      font-weight: 700;
    }
    .grade {
      font-size: 1rem;
      color: var(--muted);
    }
    .hint {
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--text);
      opacity: 0.9;
    }
    .footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .focus-ring:focus-visible {
      outline: 3px solid rgba(96,165,250,0.7);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>🎯 Math Puzzle Quest</h1>
    <p class="subtitle">Who is playing today?</p>

    <section class="grid" role="list">
      <!-- Ananya -->
      <button
        class="card focus-ring"
        role="listitem"
        data-name="Ananya"
        data-grade="6"
        aria-label="Ananya, Grade 6 puzzles"
        type="button"
      >
        <div class="badge" style="border:2px solid var(--accent-2);">🧠</div>
        <div class="name">Ananya</div>
        <div class="grade">Grade 6 Puzzles</div>
        <div class="hint">Patterns, logic, fractions, geometry, and fun story quests.</div>
      </button>

      <!-- Tarak -->
      <button
        class="card focus-ring"
        role="listitem"
        data-name="Tarak"
        data-grade="1"
        aria-label="Tarak, Grade 1 puzzles"
        type="button"
      >
        <div class="badge" style="border:2px solid var(--accent);">⭐</div>
        <div class="name">Tarak</div>
        <div class="grade">Grade 1 Puzzles</div>
        <div class="hint">Counting games, shapes, simple add/subtract, and picture puzzles.</div>
      </button>
    </section>

    <div class="footer">
      Tip: You can bookmark this page on the TV browser for easy access.
    </div>
  </main>

  <script>
    // Redirect targets (change later if you want different file names)
    const gradeToPage = {
      "6": "grade6.html",
      "1": "grade1.html"
    };

    function handlePick(btn) {
      const name = btn.dataset.name;
      const grade = btn.dataset.grade;

      // Save selection so other pages know who is playing
      localStorage.setItem("playerName", name);
      localStorage.setItem("playerGrade", grade);

      // Redirect to the right grade page
      const target = gradeToPage[grade] || "home.html";
      window.location.href = target;
    }

    document.querySelectorAll(".card").forEach(btn => {
      btn.addEventListener("click", () => handlePick(btn));
      btn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          handlePick(btn);
        }
      });
    });
  </script>
</body>
</html>
